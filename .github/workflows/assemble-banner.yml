name: Assemble banner video

on:
  push:
    paths:
      - "public/videos/upload-parts/**"
      - ".github/workflows/assemble-banner.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, 'hero: assemble banner video') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble uploaded video
        shell: bash
        run: |
          set -euo pipefail
          test -f public/videos/upload-parts/part-00.b64
          cat public/videos/upload-parts/part-*.b64 > /tmp/banner-video.b64
          base64 --decode /tmp/banner-video.b64 > public/videos/promo-comercio-popular.mp4
          cp public/videos/promo-comercio-popular.mp4 public/videos/comercio-popular-banner.mp4
          rm -rf public/videos/upload-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/promo-comercio-popular.mp4 public/videos/comercio-popular-banner.mp4 public/videos/upload-parts
          git commit -m "hero: assemble banner video [skip ci]"
          git push
