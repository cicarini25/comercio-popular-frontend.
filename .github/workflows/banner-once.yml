name: Publish banner video once
on:
  push:
    paths:
      - "public/videos/upload-parts/**"
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and publish
        shell: bash
        run: |
          set -euo pipefail
          test -f public/videos/upload-parts/READY
          cat public/videos/upload-parts/part-*.b64 > /tmp/banner-video.b64
          base64 --decode /tmp/banner-video.b64 > public/videos/promo-comercio-popular.mp4
          cp public/videos/promo-comercio-popular.mp4 public/videos/comercio-popular-banner.mp4
          rm -rf public/videos/upload-parts
          git rm -f .github/workflows/banner-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/promo-comercio-popular.mp4 public/videos/comercio-popular-banner.mp4 .github/workflows/banner-once.yml
          git commit -m "hero: publish banner video [skip ci]"
          git push
